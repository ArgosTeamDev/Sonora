services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sonora
      MYSQL_USER: sonora
      MYSQL_PASSWORD: sonora
    ports:
      - "3307:3306" # 3307 to avoid clashing with a local MySQL
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata:
