name: Deploy

on:
  push:
    branches: [main]

jobs:
  # Corre antes de tocar el servidor: si no compila o no pasan los tipos,
  # no se despliega nada.
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compilar paquete compartido
        run: pnpm --filter @project/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm --filter api build && pnpm --filter web build

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Configurar acceso SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Desplegar backend (pull + build + restart)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -e
            git config --global --add safe.directory ${{ secrets.API_PATH }}
            cd ${{ secrets.API_PATH }}
            git fetch origin main
            git reset --hard origin/main
            pnpm install
            pnpm --filter @project/shared build
            pnpm --filter api build
            pnpm --filter api migrate up
            pm2 restart api --update-env || pm2 start "pnpm --filter api start" --name api
            pm2 save
          '

      - name: Desplegar frontend (build local + subir)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -e
            git config --global --add safe.directory ${{ secrets.API_PATH }}
            cd ${{ secrets.API_PATH }}
            echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > apps/web/.env
            pnpm --filter web build
            rsync -rlD --delete apps/web/dist/ ${{ secrets.WEB_HTDOCS_PATH }}/
          '
          
      - name: Limpiar clave temporal
        if: always()
        run: rm -f ~/.ssh/deploy_key